name: Aviso diário das contas

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília. O cron do GitHub entra numa fila e
    # costuma atrasar de dez a sessenta minutos; não conte com pontualidade.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Data a simular (aaaa-mm-dd). Vazio = hoje.'
        required: false
      seco:
        description: 'Só mostrar o que enviaria, sem enviar'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: avisos
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Enviar
        working-directory: avisos
        env:
          SUPABASE_URL: https://mcwgiqwbbgdltzqgopcq.supabase.co
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          DIA:  ${{ inputs.dia }}
          SECO: ${{ inputs.seco && '1' || '' }}
        run: node enviar.mjs
