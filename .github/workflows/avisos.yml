name: Aviso diário das contas

on:
  schedule:
    # O cron do GitHub NÃO é pontual. Medido neste repositório em quatro dias
    # seguidos: agendado para 11:00 UTC, disparou às 14:35, 14:44, 14:45 e
    # 15:15 -- de 3h35 a 4h15 de atraso. Duas providências:
    #
    #   1. minuto torto. O :00 é onde todo mundo agenda, e é onde a fila é
    #      pior.
    #   2. de hora em hora, e quem decide o que mandar é o relógio de
    #      Brasília dentro do enviar.mjs. Run atrasado ainda manda; a tabela
    #      aviso_enviado impede que mande duas vezes.
    #
    # 15:17-23:17 UTC = 12:17-20:17 de Brasília (cobre os dois avisos).
    - cron: '17 15-23 * * *'
    # 00:17 e 01:17 UTC = 21:17 e 22:17 de Brasília, ainda do dia anterior.
    # É a repescagem do aviso das 20h, e para aí: aviso de conta não chega de
    # madrugada.
    - cron: '17 0-1 * * *'
  workflow_dispatch:
    inputs:
      dia:
        description: 'Data a simular (aaaa-mm-dd). Vazio = hoje.'
        required: false
      slot:
        description: 'Forçar um aviso, ignorando a hora'
        required: false
        type: choice
        # 'auto' em vez de string vazia: opção vazia num choice é canto escuro
        # do GitHub, e este arquivo ainda não foi exercitado por dispatch
        # nenhum. E os TRÊS slots têm que estar aqui — o da véspera é
        # justamente o que não dá para conferir esperando, porque só abre 20h.
        options: ['auto', 'vespera_20h', 'dia_12h', 'dia_20h']
        default: 'auto'
      seco:
        description: 'Só mostrar o que enviaria, sem enviar nem registrar'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: avisos
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Enviar
        working-directory: avisos
        env:
          SUPABASE_URL: https://mcwgiqwbbgdltzqgopcq.supabase.co
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          DIA:  ${{ inputs.dia }}
          SLOT: ${{ inputs.slot }}
          SECO: ${{ inputs.seco && '1' || '' }}
        run: node enviar.mjs
